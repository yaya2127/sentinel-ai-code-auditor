<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelAI | DevSecOps Code Security Studio & AST Playground</title>

  <!-- Google Fonts: Space Grotesk, JetBrains Mono, Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- React 18 & Babel Standalone CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --sidebar-width: 260px;
      --bg-dark: #07090e;
      --panel-bg: #0d111a;
      --panel-border: #1a2234;
      --accent-neon-green: #00ff87;
      --accent-violet: #7928ca;
      --accent-pink: #ff0080;
      --accent-cyan: #60a5fa;
      --accent-danger: #ff4d4d;
      --text-main: #f3f4f6;
      --text-dim: #9ca3af;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-code: 'Fira Code', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .font-heading { font-family: var(--font-heading); }
    .font-code { font-family: var(--font-code); }

    /* Vertical Sidebar + Main Canvas Layout */
    .app-layout {
      display: flex;
      min-height: 100vh;
    }

    /* Left Sidebar Navigation Dock */
    .sidebar-dock {
      width: var(--sidebar-width);
      background: #090c14;
      border-right: 1px solid var(--panel-border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 10;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--panel-border);
      margin-bottom: 24px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent-neon-green), var(--accent-cyan));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 1.2rem;
      box-shadow: 0 0 15px rgba(0, 255, 135, 0.4);
    }

    .brand-name {
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .brand-name span { color: var(--accent-neon-green); }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(0, 255, 135, 0.08);
      color: var(--accent-neon-green);
      border-left: 3px solid var(--accent-neon-green);
    }

    /* Main Workspace Studio */
    .main-workspace {
      margin-left: var(--sidebar-width);
      flex-grow: 1;
      padding: 28px;
      background: radial-gradient(circle at 80% 10%, rgba(121, 40, 202, 0.08) 0%, transparent 50%);
    }

    /* Top Workspace Control Bar */
    .workspace-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 14px 20px;
      border-radius: 12px;
    }

    .repo-pill {
      font-family: var(--font-code);
      font-size: 0.8rem;
      background: #141c2e;
      border: 1px solid #26334d;
      padding: 6px 12px;
      border-radius: 20px;
      color: var(--accent-cyan);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-scan {
      background: linear-gradient(135deg, var(--accent-neon-green), #059669);
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 255, 135, 0.3);
    }

    .btn-scan:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 255, 135, 0.5);
    }

    .btn-export {
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-export:hover { background: #334155; }

    /* Dual-Pane Code Auditor Workspace */
    .dual-pane-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .pane-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .pane-header {
      background: #101624;
      padding: 12px 18px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 700;
    }

    /* File Tree Navigator */
    .file-tree-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 20px;
      padding-bottom: 6px;
    }

    .file-tab {
      background: #101624;
      border: 1px solid var(--panel-border);
      padding: 8px 14px;
      border-radius: 8px;
      font-family: var(--font-code);
      font-size: 0.78rem;
      color: var(--text-dim);
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .file-tab.active {
      background: rgba(0, 255, 135, 0.1);
      border-color: var(--accent-neon-green);
      color: #fff;
    }

    .vulnerability-badge {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-pink);
      box-shadow: 0 0 8px var(--accent-pink);
    }

    /* Code Editor Line Display */
    .code-editor {
      font-family: var(--font-code);
      font-size: 0.82rem;
      background: #090c14;
      padding: 16px;
      overflow-x: auto;
      line-height: 1.7;
    }

    .code-line {
      display: flex;
      gap: 16px;
    }

    .line-number {
      width: 30px;
      color: #4b5563;
      user-select: none;
      text-align: right;
    }

    .line-vuln {
      background: rgba(255, 77, 77, 0.15);
      border-left: 3px solid var(--accent-danger);
      color: #fca5a5;
      padding-left: 8px;
      width: 100%;
    }

    .line-fix {
      background: rgba(0, 255, 135, 0.15);
      border-left: 3px solid var(--accent-neon-green);
      color: #a7f3d0;
      padding-left: 8px;
      width: 100%;
    }

    /* Bottom Interactive Command Console */
    .terminal-console {
      background: #080b12;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 16px;
      font-family: var(--font-code);
      font-size: 0.8rem;
    }

    .console-header {
      display: flex;
      justify-content: space-between;
      color: var(--text-dim);
      margin-bottom: 10px;
      font-size: 0.75rem;
    }

    .console-stream {
      color: var(--accent-neon-green);
      height: 100px;
      overflow-y: auto;
      line-height: 1.6;
    }

    textarea.playground-input {
      width: 100%;
      height: 240px;
      background: #05070d;
      color: #00ff87;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 14px;
      font-family: var(--font-code);
      font-size: 0.85rem;
      resize: vertical;
      outline: none;
    }
    textarea.playground-input:focus { border-color: var(--accent-neon-green); }

    @media (max-width: 1024px) {
      .dual-pane-grid { grid-template-columns: 1fr; }
      .sidebar-dock { width: 70px; padding: 16px 8px; }
      .sidebar-dock .brand-name, .sidebar-dock .nav-text { display: none; }
      .main-workspace { margin-left: 70px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Standalone React DevSecOps Code Auditor & Playground UI -->
  <script type="text/babel">
    const { useState } = React;

    const REPO_FILES = [
      {
        id: 'f1',
        filename: 'auth_service.py',
        path: 'services/auth_service.py',
        hasVuln: true,
        cwe: 'CWE-89 (SQLi)',
        vulnType: 'SQL Injection',
        lineNum: 14,
        vulnCode: 'cursor.execute(f"SELECT * FROM users WHERE user=\'{username}\' AND pass=\'{password}\'")',
        fixCode: 'cursor.execute("SELECT * FROM users WHERE user=? AND pass=?", (username, password))',
        desc: 'Unsanitized string interpolation inside raw SQL query execution.'
      },
      {
        id: 'f2',
        filename: 'aws_config.py',
        path: 'config/aws_config.py',
        hasVuln: true,
        cwe: 'CWE-798 (Secret)',
        vulnType: 'Hardcoded API Key',
        lineNum: 6,
        vulnCode: 'AWS_SECRET_KEY = "AKIAIOSFODNN7EXAMPLE_SECRET_KEY"',
        fixCode: 'AWS_SECRET_KEY = os.getenv("AWS_SECRET_KEY")',
        desc: 'Plaintext secret credential hardcoded directly in production source code.'
      },
      {
        id: 'f3',
        filename: 'buffer_alloc.cpp',
        path: 'native/buffer_alloc.cpp',
        hasVuln: true,
        cwe: 'CWE-120 (Buffer)',
        vulnType: 'Buffer Overflow',
        lineNum: 18,
        vulnCode: 'strcpy(dest_buffer, user_input_str); // Unchecked length copy',
        fixCode: 'strncpy(dest_buffer, user_input_str, sizeof(dest_buffer) - 1);',
        desc: 'Unbounded memory buffer copy operation vulnerable to memory corruptions.'
      },
      {
        id: 'f4',
        filename: 'worker_routine.go',
        path: 'pkg/worker_routine.go',
        hasVuln: true,
        cwe: 'CWE-391 (Panic)',
        vulnType: 'Unchecked Goroutine Panic',
        lineNum: 25,
        vulnCode: 'go processTaskWorker(job) // Missing defer recover()',
        fixCode: 'go func() { defer func() { if r := recover(); r != nil { log.Println("Recovered worker panic", r) } }(); processTaskWorker(job) }()',
        desc: 'Goroutine spawned without panic recovery handler risking service crash.'
      }
    ];

    function SentinelApp() {
      const [activeTab, setActiveTab] = useState('audit');
      const [selectedFileID, setSelectedFileID] = useState('f1');
      const [remediated, setRemediated] = useState({});
      const [isScanning, setIsScanning] = useState(false);
      const [customCode, setCustomCode] = useState('def authenticate(user, password):\n    # Paste custom code here to run live AST security audit\n    query = f"SELECT * FROM accounts WHERE name = \'{user}\'"\n    return db.execute(query)');
      const [customResult, setCustomResult] = useState(null);

      const [logs, setLogs] = useState([
        '[SYSTEM] SentinelAI AST Engine v3.5 online with C/C++/Go/Python rule support.',
        '[PARSER] Analyzed repository yaya2127/security-target-service.',
        '[AST-REASONER] 4 Security vulnerabilities identified (SQLi, Secret, Buffer Overflow, Goroutine Panic).'
      ]);

      const activeFile = REPO_FILES.find(f => f.id === selectedFileID) || REPO_FILES[0];
      const isFixed = remediated[activeFile.id];

      const handleApplyPatch = () => {
        setRemediated(prev => ({ ...prev, [activeFile.id]: true }));
        setLogs(prev => [...prev, `[PATCH-MERGE] Merged unified Git diff patch for ${activeFile.filename}. Risk index updated.`]);
      };

      const handleTriggerScan = () => {
        setIsScanning(true);
        setLogs(prev => [...prev, `[SCANNER] Re-scanning AST token trees across repository files...`]);
        setTimeout(() => {
          setIsScanning(false);
          setLogs(prev => [...prev, `[SCANNER] Re-scan complete. All security parameters compliant.`]);
        }, 1200);
      };

      const handleScanCustomCode = () => {
        setIsScanning(true);
        setTimeout(() => {
          setIsScanning(false);
          setCustomResult({
            vulnFound: customCode.includes('f"') || customCode.includes("f'") || customCode.includes('SELECT'),
            line: 3,
            vulnType: 'SQL Injection via String Format',
            cwe: 'CWE-89',
            suggestedFix: customCode.replace(/query = f".*?"/, 'query = "SELECT * FROM accounts WHERE name = ?"\n    return db.execute(query, (user,))')
          });
          setLogs(prev => [...prev, `[PLAYGROUND] AST audit completed on custom user snippet. Vulnerabilities identified & remediated.`]);
        }, 800);
      };

      const handleExportReport = () => {
        const report = {
          audit_title: "SentinelAI Security Compliance Report",
          timestamp: new Date().toISOString(),
          compliance_standard: "ISO/IEC 27001 & OWASP Top 10",
          repository: "yaya2127/security-target-service",
          remediated_count: Object.keys(remediated).length,
          vulnerabilities: REPO_FILES
        };
        const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'SentinelAI_Security_Audit_Report.json';
        a.click();
        setLogs(prev => [...prev, `[EXPORT] Downloaded official Security Audit Compliance JSON report.`]);
      };

      return (
        <div className="app-layout">
          
          {/* Left Vertical Dock Navigation */}
          <aside className="sidebar-dock">
            <div>
              <div className="brand-box">
                <div className="brand-logo">
                  <i className="fas fa-shield-halved"></i>
                </div>
                <div className="brand-name">
                  Sentinel<span>AI</span>
                </div>
              </div>

              <div className="nav-menu">
                <div className={`nav-item ${activeTab === 'audit' ? 'active' : ''}`} onClick={() => setActiveTab('audit')}>
                  <i className="fas fa-microchip"></i>
                  <span className="nav-text">AST Inspector</span>
                </div>
                <div className={`nav-item ${activeTab === 'playground' ? 'active' : ''}`} onClick={() => setActiveTab('playground')}>
                  <i className="fas fa-terminal"></i>
                  <span className="nav-text">Code Sandbox</span>
                </div>
                <div className={`nav-item ${activeTab === 'compliance' ? 'active' : ''}`} onClick={() => setActiveTab('compliance')}>
                  <i className="fas fa-award"></i>
                  <span className="nav-text">ISO/SOC2 Matrix</span>
                </div>
                <div className={`nav-item ${activeTab === 'rules' ? 'active' : ''}`} onClick={() => setActiveTab('rules')}>
                  <i className="fas fa-sliders"></i>
                  <span className="nav-text">C/C++/Go/Py Rules</span>
                </div>
              </div>
            </div>

            <div style={{ padding: '12px', background: '#07090e', borderRadius: '8px', border: '1px solid #1a2234', fontSize: '0.72rem', color: 'var(--text-dim)' }}>
              <div><strong style={{ color: '#fff' }}>Compliance:</strong> OWASP Top 10</div>
              <div><strong style={{ color: 'var(--accent-neon-green)' }}>Status:</strong> Active Defender</div>
            </div>
          </aside>

          {/* Main Workspace Studio */}
          <main className="main-workspace">
            
            {/* Top Workspace Bar */}
            <div className="workspace-topbar">
              <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                <h2 className="font-heading" style={{ fontSize: '1.2rem', color: '#fff' }}>
                  DevSecOps Security Studio
                </h2>
                <div className="repo-pill">
                  <i className="fab fa-github"></i> yaya2127/security-target-service
                </div>
              </div>

              <div style={{ display: 'flex', gap: '12px' }}>
                <button onClick={handleExportReport} className="btn-export">
                  <i className="fas fa-file-download"></i> Export Audit Report
                </button>

                <button onClick={handleTriggerScan} disabled={isScanning} className="btn-scan">
                  <i className={`fas ${isScanning ? 'fa-spinner fa-spin' : 'fa-radar'}`}></i>
                  {isScanning ? 'Scanning AST...' : 'Run Security Scan'}
                </button>
              </div>
            </div>

            {/* Render View based on Tab */}
            {activeTab === 'playground' ? (
              <div className="pane-card" style={{ padding: '24px', marginBottom: '24px' }}>
                <h3 className="font-heading" style={{ fontSize: '1.1rem', color: '#fff', marginBottom: '14px', display: 'flex', alignItems: 'center', gap: '10px' }}>
                  <i className="fas fa-vial-virus" style={{ color: 'var(--accent-neon-green)' }}></i>
                  Interactive AST Security Code Playground
                </h3>
                <p style={{ fontSize: '0.82rem', color: 'var(--text-dim)', marginBottom: '16px' }}>
                  Paste any custom Python, JavaScript, C++, or Go code snippet below to perform an instant AST vulnerability scan and view AI-suggested secure patches.
                </p>

                <textarea
                  className="playground-input"
                  value={customCode}
                  onChange={(e) => setCustomCode(e.target.value)}
                />

                <div style={{ marginTop: '16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <button onClick={handleScanCustomCode} className="btn-scan">
                    <i className="fas fa-bolt"></i> Run AST Security Analysis
                  </button>
                  <span style={{ fontSize: '0.78rem', color: 'var(--text-dim)', fontFamily: 'var(--font-code)' }}>
                    Supports SQLi, Buffer Overflow, Secrets & XSS regex rules
                  </span>
                </div>

                {customResult && (
                  <div style={{ marginTop: '24px', background: '#090c14', border: '1px solid var(--panel-border)', borderRadius: '8px', padding: '16px' }}>
                    <h4 style={{ color: customResult.vulnFound ? 'var(--accent-pink)' : 'var(--accent-neon-green)', fontSize: '0.9rem', marginBottom: '8px' }}>
                      {customResult.vulnFound ? `🚨 Vulnerability Detected: ${customResult.vulnType} (${customResult.cwe})` : '✅ Snippet Passed Security Audit'}
                    </h4>
                    {customResult.vulnFound && (
                      <div className="font-code" style={{ fontSize: '0.8rem', marginTop: '12px' }}>
                        <div style={{ color: 'var(--accent-neon-green)', marginBottom: '6px' }}>AI Suggested Remediation Fix:</div>
                        <pre style={{ background: '#04060a', padding: '12px', borderRadius: '6px', color: '#a7f3d0' }}>
                          {customResult.suggestedFix}
                        </pre>
                      </div>
                    )}
                  </div>
                )}
              </div>
            ) : (
              <div>
                {/* Target File Tab Selector */}
                <div className="file-tree-bar">
                  {REPO_FILES.map(f => (
                    <div
                      key={f.id}
                      onClick={() => setSelectedFileID(f.id)}
                      className={`file-tab ${f.id === selectedFileID ? 'active' : ''}`}
                    >
                      <i className="fas fa-file-code" style={{ color: 'var(--accent-cyan)' }}></i>
                      {f.filename}
                      {!remediated[f.id] && <span className="vulnerability-badge" title="Security Flaw Detected"></span>}
                    </div>
                  ))}
                </div>

                {/* Dual-Pane Code Auditor Workspace */}
                <div className="dual-pane-grid">
                  
                  {/* Left Pane: Vulnerable Source Code File */}
                  <div className="pane-card">
                    <div className="pane-header">
                      <span>
                        <i className="fas fa-bug" style={{ color: 'var(--accent-pink)', marginRight: '8px' }}></i>
                        Vulnerable File ({activeFile.filename})
                      </span>
                      <span style={{ color: 'var(--accent-pink)', fontSize: '0.75rem', fontFamily: 'var(--font-code)' }}>
                        {activeFile.cwe}
                      </span>
                    </div>

                    <div style={{ padding: '14px', borderBottom: '1px solid var(--panel-border)', fontSize: '0.8rem', background: '#0b0f19' }}>
                      <strong style={{ color: '#fff' }}>Flaw Category:</strong> {activeFile.vulnType}<br/>
                      <span style={{ color: 'var(--text-dim)' }}>{activeFile.desc}</span>
                    </div>

                    <div className="code-editor">
                      <div className="code-line"><span className="line-number">1</span><span>import os, sys, sqlite3</span></div>
                      <div className="code-line"><span className="line-number">2</span><span>import flask</span></div>
                      <div className="code-line"><span className="line-number">3</span><span></span></div>
                      <div className="code-line"><span className="line-number">...</span><span style={{ color: '#6b7280' }}># Core logic module</span></div>
                      
                      <div className="code-line line-vuln">
                        <span className="line-number" style={{ color: 'var(--accent-danger)' }}>{activeFile.lineNum}</span>
                        <span>{activeFile.vulnCode}</span>
                      </div>

                      <div className="code-line"><span className="line-number">...</span><span style={{ color: '#6b7280' }}># End of file</span></div>
                    </div>
                  </div>

                  {/* Right Pane: AI Secure Patch & Remediation Engine */}
                  <div className="pane-card" style={{ display: 'flex', flexDirection: 'column' }}>
                    <div className="pane-header">
                      <span>
                        <i className="fas fa-wand-magic-sparkles" style={{ color: 'var(--accent-neon-green)', marginRight: '8px' }}></i>
                        AI Synthesized Secure Patch & Diff
                      </span>
                      {!isFixed && (
                        <button onClick={handleApplyPatch} className="btn-scan" style={{ padding: '4px 10px', fontSize: '0.75rem' }}>
                          ⚡ Merge AI Patch
                        </button>
                      )}
                    </div>

                    <div style={{ padding: '14px', borderBottom: '1px solid var(--panel-border)', fontSize: '0.8rem', background: '#0b0f19' }}>
                      <strong style={{ color: 'var(--accent-neon-green)' }}>Status:</strong> {isFixed ? '✓ Security Patch Merged into Codebase' : '⚠️ Unified Git Diff Ready for Merge'}
                    </div>

                    <div className="code-editor" style={{ flexGrow: 1 }}>
                      <div style={{ color: '#6b7280', fontSize: '0.72rem', marginBottom: '8px' }}>--- Original Vulnerable Code:</div>
                      <div className="code-line line-vuln">
                        <span className="line-number">-</span>
                        <span>{activeFile.vulnCode}</span>
                      </div>

                      <div style={{ color: 'var(--accent-neon-green)', fontSize: '0.72rem', margin: '14px 0 8px' }}>+++ AI Secure Replacement:</div>
                      <div className="code-line line-fix">
                        <span className="line-number">+</span>
                        <span>{activeFile.fixCode}</span>
                      </div>
                    </div>
                  </div>

                </div>
              </div>
            )}

            {/* Bottom Interactive Command Console */}
            <div className="terminal-console">
              <div className="console-header">
                <span><i className="fas fa-terminal" style={{ color: 'var(--accent-neon-green)', marginRight: '6px' }}></i>SentinelAI Security Audit Stream</span>
                <span>Press Scan to re-verify AST tokens</span>
              </div>
              <div className="console-stream">
                {logs.map((l, i) => <div key={i}>{l}</div>)}
              </div>
            </div>

          </main>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SentinelApp />);
  </script>
</body>
</html>
