<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelAI | Autonomous Agentic AI Code Security Auditor</title>

  <!-- Google Fonts: Syne, Inter, Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- React 18 & Babel Standalone CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-dark: #0a0e17;
      --panel-bg: #111827;
      --panel-border: #1f2937;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-pink: #f43f5e;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --text-bright: #f9fafb;
      --text-dim: #9ca3af;
      --font-display: 'Syne', sans-serif;
      --font-code: 'Fira Code', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-bright);
      font-family: 'Inter', sans-serif;
      line-height: 1.5;
    }

    .font-display { font-family: var(--font-display); }
    .font-code { font-family: var(--font-code); }

    .container-fluid { max-width: 1480px; margin: 0 auto; padding: 0 24px; }

    /* Top Security Radar Banner */
    .radar-banner {
      background: linear-gradient(135deg, #130a2a 0%, #0d1222 100%);
      border-bottom: 1px solid rgba(139, 92, 246, 0.3);
      padding: 16px 0;
      position: relative;
      overflow: hidden;
    }

    .radar-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-purple), var(--accent-cyan), transparent);
      animation: radar-scan 3s linear infinite;
    }

    @keyframes radar-scan {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .header-content { display: flex; justify-content: space-between; align-items: center; }

    .logo-box { display: flex; align-items: center; gap: 14px; }

    .logo-icon-hexagon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent-purple), #4c1d95);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.2rem;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
    }

    .logo-text { font-family: var(--font-display); font-size: 1.4rem; font-weight: 800; }
    .logo-text span { color: var(--accent-purple); }

    .btn-action {
      background: linear-gradient(135deg, var(--accent-purple), #6d28d9);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }

    .btn-action:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
    }

    .sec-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
    .grid-ide { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 24px; margin-bottom: 24px; }

    /* IDE Code Editor Layout */
    .ide-container {
      background: #080c14;
      border: 1px solid #1e293b;
      border-radius: 10px;
      overflow: hidden;
    }

    .ide-header {
      background: #0f172a;
      padding: 10px 16px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-code);
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .code-diff-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-code);
      font-size: 0.8rem;
    }

    .code-diff-table td { padding: 4px 10px; }

    .line-num {
      width: 40px;
      text-align: right;
      color: #475569;
      user-select: none;
      border-right: 1px solid #1e293b;
    }

    .line-del { background: rgba(244, 63, 94, 0.15); color: #fda4af; }
    .line-add { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }

    .badge-tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .badge-cwe { background: rgba(139, 92, 246, 0.2); color: var(--accent-purple); border: 1px solid rgba(139, 92, 246, 0.4); }

    @media (max-width: 1024px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-ide { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Standalone React DevSecOps Code Auditor UI -->
  <script type="text/babel">
    const { useState } = React;

    const SECURITY_ISSUES = [
      {
        id: "VULN-01",
        cwe: "CWE-89",
        category: "OWASP A03: SQL Injection",
        severity: "CRITICAL",
        file: "auth/service.py",
        line: 18,
        snippet: "query = f\"SELECT * FROM users WHERE username = '{user}' AND password = '{pwd}'\"",
        remediation: "Replace string interpolation with parameterized SQL query placeholder parameters.",
        fixed: false,
        diffOriginal: "- query = f\"SELECT * FROM users WHERE username = '{user}' AND password = '{pwd}'\"\n- cursor.execute(query)",
        diffFixed: "+ query = \"SELECT * FROM users WHERE username = ? AND password = ?\"\n+ cursor.execute(query, (user, pwd))"
      },
      {
        id: "VULN-02",
        cwe: "CWE-798",
        category: "OWASP A07: Hardcoded Secret",
        severity: "HIGH",
        file: "config/aws.py",
        line: 7,
        snippet: "AWS_ACCESS_KEY = \"AKIAIOSFODNN7EXAMPLE_SECRET_EXPOSED\"",
        remediation: "Remove plaintext credentials from codebase. Retrieve secrets dynamically from environment variables.",
        fixed: false,
        diffOriginal: "- AWS_ACCESS_KEY = \"AKIAIOSFODNN7EXAMPLE_SECRET_EXPOSED\"",
        diffFixed: "+ AWS_ACCESS_KEY = os.getenv(\"AWS_ACCESS_KEY\")"
      },
      {
        id: "VULN-03",
        cwe: "CWE-79",
        category: "OWASP A03: Reflected XSS",
        severity: "HIGH",
        file: "views/profile.py",
        line: 29,
        snippet: "return f\"<div>Welcome back, {username}!</div>\"",
        remediation: "Escape user input using HTML sanitizer before rendering into DOM templates.",
        fixed: false,
        diffOriginal: "- return f\"<div>Welcome back, {username}!</div>\"",
        diffFixed: "+ safe_user = flask.escape(username)\n+ return f\"<div>Welcome back, {safe_user}!</div>\""
      }
    ];

    function DevSecOpsDashboard() {
      const [issues, setIssues] = useState(SECURITY_ISSUES);
      const [selectedID, setSelectedID] = useState(SECURITY_ISSUES[0].id);
      const [isScanning, setIsScanning] = useState(false);
      const [terminalLogs, setTerminalLogs] = useState([
        "[DEVSECOPS] AST Scanner v3.2 initialized.",
        "[SCANNER] Tokenizing python AST tree for repository yaya2127/auth-microservice...",
        "[SCANNER] 3 high-severity security vulnerabilities detected.",
        "[AI-REASONER] Unified diff fixes generated."
      ]);

      const activeIssue = issues.find(i => i.id === selectedID) || issues[0];
      const unfixedCount = issues.filter(i => !i.fixed).length;
      const riskScore = unfixedCount * 30;

      const handleFix = (id) => {
        setIssues(prev => prev.map(i => i.id === id ? { ...i, fixed: true } : i));
        setTerminalLogs(prev => [...prev, `[AI-AUTOFIX] Applied unified Git diff patch for ${id}. Security score updated.`]);
      };

      const handleReScan = () => {
        setIsScanning(true);
        setTerminalLogs(prev => [...prev, `[SCANNER] Re-scanning codebase repository AST tokens...`]);
        setTimeout(() => {
          setIsScanning(false);
          setTerminalLogs(prev => [...prev, `[SCANNER] Re-scan complete. All security parameters compliant.`]);
        }, 1200);
      };

      return (
        <div>
          {/* Radar Header */}
          <div className="radar-banner">
            <div className="radar-line"></div>
            <div className="container-fluid header-content">
              <div className="logo-box">
                <div className="logo-icon-hexagon">
                  <i className="fas fa-shield-cat"></i>
                </div>
                <div>
                  <div className="logo-text">SENTINEL<span>AI</span></div>
                  <div style={{ fontSize: '0.72rem', color: 'var(--text-dim)', fontFamily: 'var(--font-code)' }}>
                    DevSecOps Automated Code Vulnerability Auditor
                  </div>
                </div>
              </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                <div style={{ background: '#0f172a', border: '1px solid #1e293b', padding: '6px 12px', borderRadius: '6px', fontSize: '0.75rem', fontFamily: 'var(--font-code)' }}>
                  ISO/IEC 27001 & OWASP Top 10 Compliant
                </div>
                <button onClick={handleReScan} disabled={isScanning} className="btn-action">
                  <i className={`fas ${isScanning ? 'fa-spinner fa-spin' : 'fa-radar'}`}></i>
                  {isScanning ? 'Scanning AST...' : 'Run Security Scan'}
                </button>
              </div>
            </div>
          </div>

          {/* Main Layout */}
          <main className="container-fluid" style={{ paddingTop: '28px', paddingBottom: '40px' }}>
            
            {/* Top Score Cards */}
            <div className="grid-4">
              <ScoreCard label="Codebase Security Index" value={`${100 - riskScore}/100`} sub={riskScore === 0 ? 'Fully Secure' : 'Vulnerabilities Present'} color={riskScore === 0 ? 'var(--accent-green)' : 'var(--accent-pink)'} icon="fas fa-shield-virus" />
              <ScoreCard label="Active Vulnerabilities" value={unfixedCount} sub="Action Required" color="var(--accent-pink)" icon="fas fa-bug" />
              <ScoreCard label="OWASP Top 10 Flaws" value="3 Flaws" sub="SQLi, Secrets, XSS" color="var(--accent-amber)" icon="fas fa-triangle-exclamation" />
              <ScoreCard label="AI Patch Readiness" value="100%" sub="1-Click Git Diffs Ready" color="var(--accent-purple)" icon="fas fa-wand-magic-sparkles" />
            </div>

            {/* Main IDE Code Remediation View */}
            <div className="grid-ide">
              
              {/* Left Column: Security Issue List */}
              <div className="sec-card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                  <h3 className="font-display" style={{ fontSize: '1.05rem', color: '#fff' }}>
                    <i className="fas fa-vault" style={{ color: 'var(--accent-purple)', marginRight: '8px' }}></i>
                    AST Vulnerability Registry
                  </h3>
                  <span style={{ fontSize: '0.72rem', color: 'var(--text-dim)', fontFamily: 'var(--font-code)' }}>
                    {unfixedCount} Unresolved
                  </span>
                </div>

                <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                  {issues.map(iss => {
                    const isSelected = iss.id === selectedID;
                    return (
                      <div
                        key={iss.id}
                        onClick={() => setSelectedID(iss.id)}
                        style={{
                          background: isSelected ? 'rgba(139, 92, 246, 0.12)' : '#0d1322',
                          border: isSelected ? '1px solid var(--accent-purple)' : '1px solid #1e293b',
                          borderRadius: '8px',
                          padding: '14px',
                          cursor: 'pointer',
                          transition: 'all 0.2s ease'
                        }}
                      >
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
                          <span className="badge-tag badge-cwe">{iss.cwe}</span>
                          <span style={{ fontSize: '0.7rem', fontFamily: 'var(--font-code)', color: 'var(--accent-cyan)' }}>{iss.file}:L{iss.line}</span>
                        </div>
                        <div style={{ fontWeight: 700, fontSize: '0.88rem', color: '#fff' }}>{iss.category}</div>
                        <div style={{ fontSize: '0.78rem', color: 'var(--text-dim)', marginTop: '4px' }}>{iss.remediation}</div>
                        
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '10px', paddingTop: '8px', borderTop: '1px solid #1e293b' }}>
                          <span style={{ fontSize: '0.72rem', color: iss.fixed ? 'var(--accent-green)' : 'var(--accent-pink)', fontWeight: 700 }}>
                            {iss.fixed ? '✓ REMEDIATED' : '⚠ EXPOSED'}
                          </span>
                          {!iss.fixed && (
                            <button
                              onClick={(e) => { e.stopPropagation(); handleFix(iss.id); }}
                              style={{ background: 'var(--accent-purple)', color: '#fff', border: 'none', padding: '4px 10px', borderRadius: '4px', fontSize: '0.72rem', fontWeight: 700, cursor: 'pointer' }}
                            >
                              ⚡ Apply Patch
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Right Column: IDE Code Editor & Git Diff Fixer */}
              <div className="sec-card" style={{ display: 'flex', flexDirection: 'column' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                  <h3 className="font-display" style={{ fontSize: '1.05rem', color: '#fff' }}>
                    <i className="fas fa-code-merge" style={{ color: 'var(--accent-cyan)', marginRight: '8px' }}></i>
                    IDE Code Remediation Engine
                  </h3>
                  {!activeIssue.fixed && (
                    <button onClick={() => handleFix(activeIssue.id)} className="btn-action" style={{ fontSize: '0.78rem', padding: '6px 12px' }}>
                      <i className="fas fa-wand-magic-sparkles"></i> Apply AI Secure Patch
                    </button>
                  )}
                </div>

                <div className="ide-container" style={{ flexGrow: 1 }}>
                  <div className="ide-header">
                    <span><i className="fas fa-file-code" style={{ marginRight: '6px', color: 'var(--accent-purple)' }}></i>{activeIssue.file}</span>
                    <span style={{ color: activeIssue.fixed ? 'var(--accent-green)' : 'var(--accent-pink)' }}>
                      {activeIssue.fixed ? 'PATCH APPLIED' : 'VULNERABLE CODE DETECTED'}
                    </span>
                  </div>

                  <div style={{ padding: '16px', overflowX: 'auto' }}>
                    <div style={{ fontSize: '0.8rem', color: 'var(--text-dim)', marginBottom: '12px' }}>
                      <strong style={{ color: '#fff' }}>Vulnerable Snippet:</strong>
                    </div>
                    <table className="code-diff-table" style={{ marginBottom: '16px' }}>
                      <tbody>
                        <tr className="line-del">
                          <td className="line-num">{activeIssue.line}</td>
                          <td>{activeIssue.snippet}</td>
                        </tr>
                      </tbody>
                    </table>

                    <div style={{ fontSize: '0.8rem', color: 'var(--accent-green)', marginBottom: '8px', fontWeight: 700 }}>
                      AI Synthesized Secure Patch (Unified Diff):
                    </div>
                    <table className="code-diff-table">
                      <tbody>
                        {activeIssue.diffFixed.split('\n').map((line, idx) => (
                          <tr key={idx} className="line-add">
                            <td className="line-num">{activeIssue.line + idx}</td>
                            <td>{line}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* DevSecOps Terminal Stream */}
                <div style={{ marginTop: '20px', background: '#050811', border: '1px solid #1e293b', borderRadius: '8px', padding: '12px', fontFamily: 'var(--font-code)', fontSize: '0.75rem', color: 'var(--accent-cyan)' }}>
                  <div style={{ color: 'var(--text-dim)', marginBottom: '6px', fontSize: '0.7rem' }}>LIVE AST AUDIT STREAM</div>
                  {terminalLogs.slice(-3).map((l, i) => <div key={i}>{l}</div>)}
                </div>
              </div>

            </div>

          </main>
        </div>
      );
    }

    function ScoreCard({ label, value, sub, color, icon }) {
      return (
        <div className="sec-card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
            <span style={{ fontSize: '0.78rem', color: 'var(--text-dim)', fontWeight: 700 }}>{label}</span>
            <i className={icon} style={{ color, fontSize: '1.1rem' }}></i>
          </div>
          <div className="font-display" style={{ fontSize: '1.7rem', fontWeight: 800, color: '#fff' }}>{value}</div>
          <div style={{ fontSize: '0.72rem', color, fontWeight: 600, marginTop: '2px' }}>{sub}</div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DevSecOpsDashboard />);
  </script>
</body>
</html>
