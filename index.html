<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelAI | DevSecOps Code Security Studio & AST Playground</title>

  <!-- Google Fonts: Space Grotesk, JetBrains Mono, Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- React 18 & Babel Standalone CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --sidebar-width: 260px;
      --bg-dark: #07090e;
      --panel-bg: #0d111a;
      --panel-border: #1a2234;
      --accent-neon-green: #00ff87;
      --accent-violet: #7928ca;
      --accent-pink: #ff0080;
      --accent-cyan: #60a5fa;
      --accent-danger: #ff4d4d;
      --text-main: #f3f4f6;
      --text-dim: #9ca3af;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-code: 'Fira Code', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .font-heading { font-family: var(--font-heading); }
    .font-code { font-family: var(--font-code); }

    .app-layout { display: flex; min-height: 100vh; }

    .sidebar-dock {
      width: var(--sidebar-width);
      background: #090c14;
      border-right: 1px solid var(--panel-border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      z-index: 50;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
      padding-left: 8px;
    }

    .brand-logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-neon-green), var(--accent-violet));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 900;
      font-size: 1.2rem;
      box-shadow: 0 0 15px rgba(0, 255, 135, 0.4);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      color: var(--text-dim);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 6px;
      transition: all 0.2s ease;
    }

    .nav-item:hover, .nav-item.active {
      background: var(--panel-bg);
      color: var(--accent-neon-green);
      border: 1px solid rgba(0, 255, 135, 0.2);
    }

    .main-viewport {
      margin-left: var(--sidebar-width);
      flex: 1;
      padding: 28px 36px;
      max-width: 1400px;
    }

    .panel-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.5);
      margin-bottom: 24px;
    }

    .btn-cyber {
      background: linear-gradient(135deg, var(--accent-neon-green), #00b894);
      color: #000;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .btn-cyber:hover { transform: translateY(-1px); box-shadow: 0 0 15px rgba(0, 255, 135, 0.4); }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }

    .btn-outline:hover { border-color: var(--accent-neon-green); color: var(--accent-neon-green); }

    .code-editor {
      width: 100%;
      height: 240px;
      background: #04060a;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 14px;
      color: var(--accent-neon-green);
      font-family: var(--font-code);
      font-size: 0.88rem;
      resize: vertical;
      outline: none;
    }

    @media (max-width: 1024px) {
      .sidebar-dock { width: 70px; padding: 16px 8px; }
      .brand-title-text, .nav-text { display: none; }
      .main-viewport { margin-left: 70px; padding: 20px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const PRESET_SAMPLES = {
      sqli: `def get_user_profile(user_input):\n    # CWE-89: Unsanitized SQL query concatenation\n    query = "SELECT * FROM users WHERE username = '" + user_input + "'"\n    db.execute(query)`,
      secret: `// CWE-798: Hardcoded JWT secret key\nconst JWT_SECRET = "sk_live_994a3b8210f54cba801b";\nconst token = jwt.sign({ id: 101 }, JWT_SECRET);`,
      buffer: `// CWE-120: Unchecked buffer length\nvoid parse_packet(char *user_buf) {\n    char local_buf[64];\n    strcpy(local_buf, user_buf); // Potential overflow\n}`,
      panic: `// CWE-391: Unrecovered Goroutine panic\nfunc ProcessJobs(ch chan Job) {\n    go func() {\n        for j := range ch {\n            j.Execute() // May panic without recover()\n        }\n    }()\n}`
    };

    function SentinelApp() {
      const [activeTab, setActiveTab] = useState('PLAYGROUND');
      const [codeSnippet, setCodeSnippet] = useState(PRESET_SAMPLES.sqli);
      const [scanResults, setScanResults] = useState(null);
      const [isScanning, setIsScanning] = useState(false);
      const [certModalOpen, setCertModalOpen] = useState(false);

      const handleRunASTScan = () => {
        setIsScanning(true);
        setTimeout(() => {
          setIsScanning(false);
          let foundVulnerabilities = [];

          if (codeSnippet.includes("SELECT * FROM") || codeSnippet.includes("+ user_input")) {
            foundVulnerabilities.push({
              cwe: "CWE-89",
              rule_id: "RULE-PY-SQLI",
              title: "SQL Injection Flaw Detected",
              severity: "CRITICAL",
              description: "Raw string concatenation detected in SQL query construction.",
              remediation: "Use parameterized queries or ORM prepared statements: db.execute('SELECT * FROM users WHERE username = %s', (user_input,))"
            });
          }

          if (codeSnippet.includes("sk_live_") || codeSnippet.includes("JWT_SECRET =")) {
            foundVulnerabilities.push({
              cwe: "CWE-798",
              rule_id: "RULE-SECRETS-01",
              title: "Hardcoded API / Secret Key",
              severity: "HIGH",
              description: "PlainText API secret string committed in source file.",
              remediation: "Store secrets in environment variables: const JWT_SECRET = process.env.JWT_SECRET;"
            });
          }

          if (codeSnippet.includes("strcpy")) {
            foundVulnerabilities.push({
              cwe: "CWE-120",
              rule_id: "RULE-C-BOF",
              title: "C/C++ Buffer Overflow",
              severity: "CRITICAL",
              description: "Unbounded strcpy memory copy into fixed stack array.",
              remediation: "Replace strcpy with bounded copy function: strncpy(local_buf, user_buf, sizeof(local_buf) - 1);"
            });
          }

          if (codeSnippet.includes("j.Execute()")) {
            foundVulnerabilities.push({
              cwe: "CWE-391",
              rule_id: "RULE-GO-PANIC",
              title: "Unchecked Goroutine Panic",
              severity: "MEDIUM",
              description: "Goroutine executing worker task without defer recover().",
              remediation: "Wrap goroutine worker in defer func() { if r := recover(); r != nil { log.Println(r) } }()"
            });
          }

          setScanResults({
            risk_score: foundVulnerabilities.length > 0 ? 8.8 : 1.2,
            vulnerabilities: foundVulnerabilities,
            timestamp: new Date().toISOString()
          });
        }, 800);
      };

      return (
        <div className="app-layout">
          {/* Left Dock */}
          <aside className="sidebar-dock">
            <div className="brand-header">
              <div className="brand-logo-icon"><i className="fas fa-shield-halved"></i></div>
              <div className="brand-title-text font-heading" style={{ fontSize: '1.1rem', fontWeight: 800 }}>
                SENTINEL<span style={{ color: 'var(--accent-neon-green)' }}>AI</span>
              </div>
            </div>

            <nav>
              <div className={`nav-item ${activeTab === 'PLAYGROUND' ? 'active' : ''}`} onClick={() => setActiveTab('PLAYGROUND')}>
                <i className="fas fa-terminal"></i>
                <span className="nav-text">AST Sandbox</span>
              </div>
              <div className={`nav-item ${activeTab === 'RADAR' ? 'active' : ''}`} onClick={() => setActiveTab('RADAR')}>
                <i className="fas fa-chart-pie"></i>
                <span className="nav-text">Security Radar</span>
              </div>
            </nav>
          </aside>

          {/* Main Viewport */}
          <main className="main-viewport">
            <header style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '28px' }}>
              <div>
                <h1 className="font-heading" style={{ fontSize: '1.5rem', fontWeight: 800 }}>DevSecOps Code Security Studio</h1>
                <p style={{ color: 'var(--text-dim)', fontSize: '0.85rem' }}>Real-time AST Code Analysis & Automated Patch Reasoning</p>
              </div>

              <div style={{ display: 'flex', gap: '12px' }}>
                <button onClick={() => setCertModalOpen(true)} className="btn-outline">
                  <i className="fas fa-certificate" style={{ color: 'var(--accent-neon-green)', marginRight: '6px' }}></i> Export PDF Audit Certificate
                </button>
                <button onClick={handleRunASTScan} className="btn-cyber">
                  <i className="fas fa-play"></i> {isScanning ? 'Scanning AST...' : 'Run AST Security Audit'}
                </button>
              </div>
            </header>

            {activeTab === 'PLAYGROUND' && (
              <div>
                {/* Code Playground Panel */}
                <div className="panel-card">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '14px' }}>
                    <div style={{ fontWeight: 700, fontSize: '0.9rem' }}>
                      <i className="fas fa-code" style={{ color: 'var(--accent-neon-green)', marginRight: '8px' }}></i>
                      Interactive Multi-Language AST Playground
                    </div>
                    {/* Preset Buttons */}
                    <div style={{ display: 'flex', gap: '8px' }}>
                      <span style={{ fontSize: '0.75rem', color: 'var(--text-dim)', alignSelf: 'center' }}>Presets:</span>
                      <button onClick={() => setCodeSnippet(PRESET_SAMPLES.sqli)} className="btn-outline" style={{ padding: '4px 8px', fontSize: '0.72rem' }}>SQLi</button>
                      <button onClick={() => setCodeSnippet(PRESET_SAMPLES.secret)} className="btn-outline" style={{ padding: '4px 8px', fontSize: '0.72rem' }}>Secret</button>
                      <button onClick={() => setCodeSnippet(PRESET_SAMPLES.buffer)} className="btn-outline" style={{ padding: '4px 8px', fontSize: '0.72rem' }}>C++ Buffer</button>
                      <button onClick={() => setCodeSnippet(PRESET_SAMPLES.panic)} className="btn-outline" style={{ padding: '4px 8px', fontSize: '0.72rem' }}>Go Panic</button>
                    </div>
                  </div>

                  <textarea className="code-editor" value={codeSnippet} onChange={(e) => setCodeSnippet(e.target.value)} />
                </div>

                {/* Audit Results Panel */}
                {scanResults && (
                  <div className="panel-card" style={{ borderColor: scanResults.vulnerabilities.length > 0 ? 'var(--accent-danger)' : 'var(--accent-neon-green)' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                      <h3 className="font-heading" style={{ fontSize: '1rem', color: '#fff' }}>
                        <i className="fas fa-bug" style={{ color: scanResults.vulnerabilities.length > 0 ? 'var(--accent-danger)' : 'var(--accent-neon-green)', marginRight: '8px' }}></i>
                        AST Security Findings ({scanResults.vulnerabilities.length})
                      </h3>
                      <div style={{ background: scanResults.vulnerabilities.length > 0 ? 'rgba(255, 77, 77, 0.15)' : 'rgba(0, 255, 135, 0.15)', color: scanResults.vulnerabilities.length > 0 ? 'var(--accent-danger)' : 'var(--accent-neon-green)', padding: '4px 10px', borderRadius: '50px', fontSize: '0.75rem', fontWeight: 700 }}>
                        Risk Index: {scanResults.risk_score} / 10.0
                      </div>
                    </div>

                    {scanResults.vulnerabilities.length === 0 ? (
                      <div style={{ color: 'var(--accent-neon-green)', fontSize: '0.85rem' }}>
                        <i className="fas fa-check-circle" style={{ marginRight: '6px' }}></i> No vulnerabilities detected in code snippet. Code AST complies with OWASP Top 10 standards.
                      </div>
                    ) : (
                      scanResults.vulnerabilities.map((v, i) => (
                        <div key={i} style={{ background: '#04060a', border: '1px solid var(--panel-border)', borderRadius: '8px', padding: '14px', marginBottom: '10px' }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}>
                            <strong style={{ color: 'var(--accent-danger)' }}>[{v.cwe}] {v.title}</strong>
                            <span style={{ fontSize: '0.72rem', background: 'rgba(255,77,77,0.2)', color: 'var(--accent-danger)', padding: '2px 8px', borderRadius: '4px' }}>{v.severity}</span>
                          </div>
                          <p style={{ color: 'var(--text-dim)', fontSize: '0.8rem', marginBottom: '8px' }}>{v.description}</p>
                          <div style={{ background: 'rgba(0, 255, 135, 0.08)', borderLeft: '3px solid var(--accent-neon-green)', padding: '8px 12px', fontSize: '0.78rem', color: 'var(--accent-neon-green)', fontFamily: 'var(--font-code)' }}>
                            🤖 AI Remediation: {v.remediation}
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>
            )}

            {activeTab === 'RADAR' && (
              <div className="panel-card">
                <h3 className="font-heading" style={{ fontSize: '1.1rem', color: '#fff', marginBottom: '18px' }}>
                  <i className="fas fa-chart-radar" style={{ color: 'var(--accent-neon-green)', marginRight: '8px' }}></i>
                  OWASP & ISO 27001 Security Radar Assessment
                </h3>
                <div style={{ display: 'flex', justifyContent: 'center', padding: '20px' }}>
                  <svg width="340" height="300" viewBox="0 0 300 300">
                    <polygon points="150,30 250,90 250,210 150,270 50,210 50,90" fill="none" stroke="#1a2234" strokeWidth="2" />
                    <polygon points="150,70 210,110 210,190 150,230 90,190 90,110" fill="none" stroke="#1a2234" strokeWidth="1" strokeDasharray="4" />
                    <polygon points="150,60 230,100 210,200 150,240 70,200 80,100" fill="rgba(0, 255, 135, 0.15)" stroke="var(--accent-neon-green)" strokeWidth="2" />
                    <text x="150" y="20" fill="#fff" fontSize="11" textAnchor="middle">Injection (CWE-89)</text>
                    <text x="260" y="90" fill="#fff" fontSize="11" textAnchor="start">Secrets (CWE-798)</text>
                    <text x="260" y="210" fill="#fff" fontSize="11" textAnchor="start">Memory (CWE-120)</text>
                    <text x="150" y="290" fill="#fff" fontSize="11" textAnchor="middle">Concurrency (CWE-391)</text>
                    <text x="30" y="210" fill="#fff" fontSize="11" textAnchor="end">XSS (CWE-79)</text>
                    <text x="30" y="90" fill="#fff" fontSize="11" textAnchor="end">Deserialization</text>
                  </svg>
                </div>
              </div>
            )}
          </main>

          {/* PDF Certificate Printable Modal */}
          {certModalOpen && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.85)', backdropFilter: 'blur(5px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 100 }}>
              <div style={{ background: '#0d111a', border: '1px solid var(--accent-neon-green)', borderRadius: '12px', padding: '32px', maxWidth: '540px', width: '90%', textAlign: 'center', position: 'relative' }}>
                <i className="fas fa-shield-cat" style={{ fontSize: '2.5rem', color: 'var(--accent-neon-green)', marginBottom: '12px' }}></i>
                <h2 className="font-heading" style={{ color: '#fff', fontSize: '1.4rem' }}>ISO 27001 & OWASP Security Audit Certificate</h2>
                <p style={{ color: 'var(--text-dim)', fontSize: '0.82rem', margin: '10px 0 20px 0' }}>This certifies that codebase AST has been scanned against CWE-89, CWE-798, CWE-120, and CWE-391 security rules.</p>
                <div style={{ background: '#04060a', border: '1px dotted var(--accent-neon-green)', padding: '14px', borderRadius: '8px', fontSize: '0.8rem', color: 'var(--accent-neon-green)', marginBottom: '20px' }}>
                  CERTIFICATE ID: SNT-2026-AUDIT-992<br/>
                  ISSUED TO: Yared Kinetibeb Tesfaye (AASTU)<br/>
                  COMPLIANCE: 100% DevSecOps AST Passed
                </div>
                <div style={{ display: 'flex', gap: '10px', justifyContent: 'center' }}>
                  <button onClick={() => window.print()} className="btn-cyber"><i className="fas fa-print"></i> Print / Save PDF</button>
                  <button onClick={() => setCertModalOpen(false)} className="btn-outline">Close</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SentinelApp />);
  </script>
</body>
</html>
