<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelAI | Autonomous Agentic AI Code Security Auditor</title>

  <!-- Google Fonts: Orbitron, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- React 18 & Babel Standalone CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-obsidian: #080511;
      --card-bg: #110b24;
      --card-border: #26164a;
      --accent-violet: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-heading: 'Orbitron', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-obsidian);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
    }

    .font-heading { font-family: var(--font-heading); }
    .font-mono { font-family: var(--font-mono); }

    .container-fluid { max-width: 1440px; margin: 0 auto; padding: 0 20px; }

    .cyber-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease;
    }

    .cyber-card:hover {
      border-color: rgba(139, 92, 246, 0.4);
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.15);
    }

    .app-header {
      background: #0d071d;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 0;
    }

    .header-flex { display: flex; justify-content: space-between; align-items: center; }

    .brand-title {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title span { color: var(--accent-violet); }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 50px;
      text-transform: uppercase;
    }

    .status-critical { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
    .status-high { background: rgba(236, 72, 153, 0.15); color: var(--accent-pink); border: 1px solid rgba(236, 72, 153, 0.3); }
    .status-secure { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }

    .btn-cyber {
      background: var(--accent-violet);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-cyber:hover { background: #9d72ff; box-shadow: 0 0 15px rgba(139, 92, 246, 0.4); }

    .dashboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
    .main-layout-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 24px; margin-bottom: 24px; }

    /* Code Diff Styling */
    .diff-line-del { background: rgba(239, 68, 68, 0.2); color: #f87171; display: block; padding: 2px 8px; }
    .diff-line-add { background: rgba(16, 185, 129, 0.2); color: #4ade80; display: block; padding: 2px 8px; }

    @media (max-width: 1024px) {
      .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
      .main-layout-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .header-flex { flex-direction: column; align-items: flex-start; gap: 14px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Standalone React + SentinelAI Security Dashboard -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const MOCK_VULNERABILITIES = [
      {
        vuln_id: "VULN-17-SEC-SQLI-001",
        file_path: "samples/vulnerable_auth.py",
        line_number: 17,
        vuln_type: "SQL_INJECTION",
        severity: "CRITICAL",
        cwe_id: "CWE-89",
        vulnerable_snippet: "query = f\"SELECT * FROM users WHERE username = '{username}' AND password = '{password}'\"",
        description: "SQL Query crafted using raw string formatting. Vulnerable to SQL Injection authentication bypass.",
        recommendation: "Use parameterized SQL queries with placeholder parameters (cursor.execute('SELECT...', (username, password)))",
        remediated: false
      },
      {
        vuln_id: "VULN-8-SEC-SECRET-002",
        file_path: "samples/vulnerable_auth.py",
        line_number: 8,
        vuln_type: "HARDCODED_SECRET",
        severity: "HIGH",
        cwe_id: "CWE-798",
        vulnerable_snippet: "AWS_SECRET_ACCESS_KEY = \"AKIAIOSFODNN7EXAMPLE_SECRET_KEY_EXPOSED\"",
        description: "Hardcoded AWS secret key exposed in plaintext source code.",
        recommendation: "Migrate secrets to environment variables (os.getenv('AWS_SECRET_ACCESS_KEY')) or secret vaults.",
        remediated: false
      },
      {
        vuln_id: "VULN-29-SEC-XSS-003",
        file_path: "samples/vulnerable_auth.py",
        line_number: 29,
        vuln_type: "XSS_VULNERABILITY",
        severity: "HIGH",
        cwe_id: "CWE-79",
        vulnerable_snippet: "html_response = f\"<h1>Welcome to Sentinel Portal, {name}!</h1>\"",
        description: "Unsanitized user input reflected directly into HTML output. Vulnerable to Cross-Site Scripting (XSS).",
        recommendation: "Escape HTML variables using flask.escape(name) or sanitize DOM inputs.",
        remediated: false
      },
      {
        vuln_id: "VULN-37-SEC-TRAVERSAL-004",
        file_path: "samples/vulnerable_auth.py",
        line_number: 37,
        vuln_type: "PATH_TRAVERSAL",
        severity: "HIGH",
        cwe_id: "CWE-22",
        vulnerable_snippet: "with open(\"/var/logs/\" + filename, \"r\") as f:",
        description: "User-supplied filename used directly in file system operation. Risk of Path Traversal / Arbitrary File Read.",
        recommendation: "Validate path boundaries using os.path.basename() or secure filename sanitizers.",
        remediated: false
      }
    ];

    const MOCK_PATCHES = {
      "VULN-17-SEC-SQLI-001": {
        original: "query = f\"SELECT * FROM users WHERE username = '{username}' AND password = '{password}'\"\ncursor.execute(query)",
        patched: "query = \"SELECT * FROM users WHERE username = ? AND password = ?\"\ncursor.execute(query, (username, password))",
        diff: "--- a/samples/vulnerable_auth.py\n+++ b/samples/vulnerable_auth.py\n@@ -17,2 +17,2 @@\n- query = f\"SELECT * FROM users WHERE username = '{username}' AND password = '{password}'\"\n- cursor.execute(query)\n+ query = \"SELECT * FROM users WHERE username = ? AND password = ?\"\n+ cursor.execute(query, (username, password))"
      },
      "VULN-8-SEC-SECRET-002": {
        original: "AWS_SECRET_ACCESS_KEY = \"AKIAIOSFODNN7EXAMPLE_SECRET_KEY_EXPOSED\"",
        patched: "AWS_SECRET_ACCESS_KEY = os.getenv(\"AWS_SECRET_ACCESS_KEY\")",
        diff: "--- a/samples/vulnerable_auth.py\n+++ b/samples/vulnerable_auth.py\n@@ -8,1 +8,1 @@\n- AWS_SECRET_ACCESS_KEY = \"AKIAIOSFODNN7EXAMPLE_SECRET_KEY_EXPOSED\"\n+ AWS_SECRET_ACCESS_KEY = os.getenv(\"AWS_SECRET_ACCESS_KEY\")"
      },
      "VULN-29-SEC-XSS-003": {
        original: "html_response = f\"<h1>Welcome to Sentinel Portal, {name}!</h1>\"",
        patched: "safe_name = flask.escape(name)\nhtml_response = f\"<h1>Welcome to Sentinel Portal, {safe_name}!</h1>\"",
        diff: "--- a/samples/vulnerable_auth.py\n+++ b/samples/vulnerable_auth.py\n@@ -29,1 +29,2 @@\n- html_response = f\"<h1>Welcome to Sentinel Portal, {name}!</h1>\"\n+ safe_name = flask.escape(name)\n+ html_response = f\"<h1>Welcome to Sentinel Portal, {safe_name}!</h1>\""
      },
      "VULN-37-SEC-TRAVERSAL-004": {
        original: "with open(\"/var/logs/\" + filename, \"r\") as f:",
        patched: "safe_file = os.path.basename(filename)\nwith open(os.path.join(\"/var/logs/\", safe_file), \"r\") as f:",
        diff: "--- a/samples/vulnerable_auth.py\n+++ b/samples/vulnerable_auth.py\n@@ -37,1 +37,2 @@\n- with open(\"/var/logs/\" + filename, \"r\") as f:\n+ safe_file = os.path.basename(filename)\n+ with open(os.path.join(\"/var/logs/\", safe_file), \"r\") as f:"
      }
    };

    function SentinelApp() {
      const [vulnerabilities, setVulnerabilities] = useState(MOCK_VULNERABILITIES);
      const [selectedVulnID, setSelectedVulnID] = useState(MOCK_VULNERABILITIES[0].vuln_id);
      const [isScanning, setIsScanning] = useState(false);
      const [logs, setLogs] = useState([
        "[00:27:01] 🛡️ SentinelAI Core Engine Initialized.",
        "[00:27:02] 🔍 AST Parser tokenizing target repo: yaya2127/vulnerable-auth-service...",
        "[00:27:03] ⚠️ Security Rule SEC-SQLI-001 triggered on line 17.",
        "[00:27:03] ⚠️ Security Rule SEC-SECRET-002 triggered on line 8.",
        "[00:27:04] 🤖 Agentic Reasoner synthesizing unified Git diff patches & unit test suites..."
      ]);

      const handleRunScan = () => {
        setIsScanning(true);
        setLogs(prev => [...prev, `[${new Date().toLocaleTimeString()}] 🚀 Initiating full codebase AST re-audit...`]);
        
        setTimeout(() => {
          setIsScanning(false);
          setLogs(prev => [...prev, `[${new Date().toLocaleTimeString()}] ✅ AST Audit complete. 4 vulnerabilities evaluated. Risk Index: 75/100.`]);
        }, 1200);
      };

      const handleApplyFix = (id) => {
        setVulnerabilities(prev => prev.map(v => v.vuln_id === id ? { ...v, remediated: true } : v));
        setLogs(prev => [...prev, `[${new Date().toLocaleTimeString()}] 🔧 Applied AI Patch for ${id}. Security status updated to SECURE.`]);
      };

      const selectedVuln = vulnerabilities.find(v => v.vuln_id === selectedVulnID) || vulnerabilities[0];
      const currentPatch = MOCK_PATCHES[selectedVulnID] || MOCK_PATCHES["VULN-17-SEC-SQLI-001"];

      const activeVulns = vulnerabilities.filter(v => !v.remediated);
      const riskScore = Math.max(0, activeVulns.length * 20);

      return (
        <div>
          {/* Header */}
          <header className="app-header">
            <div className="container-fluid header-flex">
              <div className="brand-title">
                <i className="fas fa-shield-halved" style={{ color: 'var(--accent-violet)' }}></i>
                SENTINEL<span>AI</span>
                <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)', fontWeight: 500, marginLeft: '8px' }}>
                  v3.0 Autonomous Agentic AI Code Auditor
                </span>
              </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                <div className={`status-pill ${riskScore > 50 ? 'status-critical' : riskScore > 0 ? 'status-high' : 'status-secure'}`}>
                  <i className="fas fa-biohazard"></i>
                  {riskScore > 50 ? `CRITICAL RISK (${riskScore}/100)` : riskScore > 0 ? `WARNING (${riskScore}/100)` : 'CODEBASE SECURE (0/100)'}
                </div>

                <button onClick={handleRunScan} disabled={isScanning} className="btn-cyber">
                  <i className={`fas ${isScanning ? 'fa-spinner fa-spin' : 'fa-play'}`}></i>
                  {isScanning ? 'Auditing AST...' : 'Run Security Audit'}
                </button>
              </div>
            </div>
          </header>

          {/* Main Container */}
          <main className="container-fluid" style={{ paddingTop: '24px', paddingBottom: '40px' }}>
            {/* Top Security Metrics */}
            <div className="dashboard-grid">
              <MetricCard title="Repository Risk Score" val={`${riskScore}/100`} sub={riskScore > 50 ? 'Action Required' : 'Passed'} icon="fas fa-gauge-high" color={riskScore > 50 ? 'var(--accent-red)' : 'var(--accent-green)'} />
              <MetricCard title="Critical Vulnerabilities" val={activeVulns.filter(v => v.severity === 'CRITICAL').length} sub="SQL Injection / RCE" icon="fas fa-skull-crossbones" color="var(--accent-red)" />
              <MetricCard title="High Risk Flaws" val={activeVulns.filter(v => v.severity === 'HIGH').length} sub="XSS & Secrets Exposure" icon="fas fa-bug" color="var(--accent-pink)" />
              <MetricCard title="AI Patches Synthesized" val={vulnerabilities.length} sub="1-Click Remediation Ready" icon="fas fa-wand-magic-sparkles" color="var(--accent-violet)" />
            </div>

            {/* Vulnerability Matrix & Git Diff Patch Viewer */}
            <div className="main-layout-grid">
              <VulnerabilityMatrixTable
                vulnerabilities={vulnerabilities}
                selectedID={selectedVulnID}
                onSelect={setSelectedVulnID}
                onApplyFix={handleApplyFix}
              />
              <GitDiffPatchViewer
                vulnerability={selectedVuln}
                patch={currentPatch}
                onApplyFix={handleApplyFix}
              />
            </div>

            {/* Terminal Log & Unit Test Suite */}
            <div className="main-layout-grid">
              <AuditTerminal logs={logs} />
              <UnitTestSuiteViewer vulnerability={selectedVuln} />
            </div>
          </main>
        </div>
      );
    }

    // Metric Card Component
    function MetricCard({ title, val, sub, icon, color }) {
      return (
        <div className="cyber-card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
            <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 700 }}>{title}</span>
            <i className={icon} style={{ color, fontSize: '1.2rem' }}></i>
          </div>
          <div className="font-heading" style={{ fontSize: '1.8rem', fontWeight: 800, color: '#fff' }}>{val}</div>
          <div style={{ fontSize: '0.72rem', color, fontWeight: 600, marginTop: '4px' }}>{sub}</div>
        </div>
      );
    }

    // Vulnerability Matrix Component
    function VulnerabilityMatrixTable({ vulnerabilities, selectedID, onSelect, onApplyFix }) {
      return (
        <div className="cyber-card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
            <h3 className="font-heading" style={{ fontSize: '1rem', color: '#fff', display: 'flex', alignItems: 'center', gap: '8px' }}>
              <i className="fas fa-list-check" style={{ color: 'var(--accent-violet)' }}></i>
              AST Code Vulnerability Matrix
            </h3>
            <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>Select row to view Git diff patch</span>
          </div>

          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '0.82rem' }}>
              <thead>
                <tr style={{ borderBottom: '1px solid var(--card-border)', color: 'var(--text-muted)', textAlign: 'left' }}>
                  <th style={{ padding: '10px' }}>Severity / CWE</th>
                  <th style={{ padding: '10px' }}>Vulnerability Type</th>
                  <th style={{ padding: '10px' }}>File & Line</th>
                  <th style={{ padding: '10px' }}>Status</th>
                  <th style={{ padding: '10px', textAlign: 'right' }}>Remediation</th>
                </tr>
              </thead>
              <tbody>
                {vulnerabilities.map(v => {
                  const isSelected = v.vuln_id === selectedID;
                  return (
                    <tr
                      key={v.vuln_id}
                      onClick={() => onSelect(v.vuln_id)}
                      style={{
                        borderBottom: '1px solid var(--card-border)',
                        cursor: 'pointer',
                        background: isSelected ? 'rgba(139, 92, 246, 0.15)' : 'transparent',
                        transition: 'background 0.2s ease'
                      }}
                    >
                      <td style={{ padding: '12px' }}>
                        <span className={`status-pill ${v.severity === 'CRITICAL' ? 'status-critical' : 'status-high'}`}>
                          {v.severity} ({v.cwe_id})
                        </span>
                      </td>
                      <td style={{ padding: '12px', fontWeight: 700, color: '#fff' }}>{v.vuln_type}</td>
                      <td style={{ padding: '12px', fontFamily: 'var(--font-mono)', color: 'var(--accent-cyan)' }}>
                        {v.file_path}:L{v.line_number}
                      </td>
                      <td style={{ padding: '12px' }}>
                        {v.remediated ? (
                          <span style={{ color: 'var(--accent-green)', fontWeight: 700 }}><i className="fas fa-check-circle"></i> REMEDIATED</span>
                        ) : (
                          <span style={{ color: 'var(--accent-red)', fontWeight: 700 }}><i className="fas fa-exclamation-triangle"></i> EXPOSED</span>
                        )}
                      </td>
                      <td style={{ padding: '12px', textAlign: 'right' }}>
                        {!v.remediated && (
                          <button
                            onClick={(e) => { e.stopPropagation(); onApplyFix(v.vuln_id); }}
                            className="btn-cyber"
                            style={{ fontSize: '0.7rem', padding: '4px 10px' }}
                          >
                            ⚡ Apply AI Fix
                          </button>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Git Diff Viewer Component
    function GitDiffPatchViewer({ vulnerability, patch, onApplyFix }) {
      return (
        <div className="cyber-card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
            <h3 className="font-heading" style={{ fontSize: '0.95rem', color: '#fff', display: 'flex', alignItems: 'center', gap: '8px' }}>
              <i className="fas fa-code-compare" style={{ color: 'var(--accent-violet)' }}></i>
              AI Patch Synthesizer & Unified Git Diff
            </h3>
            {vulnerability && !vulnerability.remediated && (
              <button onClick={() => onApplyFix(vulnerability.vuln_id)} className="btn-cyber">
                <i className="fas fa-wand-magic-sparkles"></i> Apply AI Patch
              </button>
            )}
          </div>

          <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginBottom: '12px' }}>
            <strong style={{ color: '#fff' }}>Flaw Description:</strong> {vulnerability.description}<br/>
            <strong style={{ color: 'var(--accent-green)' }}>Recommendation:</strong> {vulnerability.recommendation}
          </div>

          <div className="font-mono" style={{ background: '#05030b', border: '1px solid var(--card-border)', borderRadius: '8px', padding: '14px', fontSize: '0.78rem', overflowX: 'auto', maxHeight: '220px' }}>
            {patch.diff.split('\n').map((line, i) => {
              if (line.startsWith('-')) return <span key={i} className="diff-line-del">{line}</span>;
              if (line.startsWith('+')) return <span key={i} className="diff-line-add">{line}</span>;
              return <div key={i} style={{ color: '#888', padding: '1px 8px' }}>{line}</div>;
            })}
          </div>
        </div>
      );
    }

    // Audit Terminal Component
    function AuditTerminal({ logs }) {
      return (
        <div className="cyber-card">
          <h3 className="font-heading" style={{ fontSize: '0.95rem', color: '#fff', marginBottom: '12px' }}>
            <i className="fas fa-terminal" style={{ color: 'var(--accent-cyan)', marginRight: '8px' }}></i>
            Live AST Security Audit Log Stream
          </h3>
          <div className="font-mono" style={{ background: '#040209', border: '1px solid var(--card-border)', borderRadius: '8px', padding: '14px', height: '180px', overflowY: 'auto', fontSize: '0.78rem', color: '#38bdf8' }}>
            {logs.map((log, i) => <div key={i} style={{ marginBottom: '4px' }}>{log}</div>)}
          </div>
        </div>
      );
    }

    // Unit Test Suite Viewer
    function UnitTestSuiteViewer({ vulnerability }) {
      const sampleTest = `# Auto-Generated Pytest Security Unit Test Suite
import pytest
from samples.vulnerable_auth import app

def test_remediate_${vulnerability.vuln_type.toLowerCase()}_L${vulnerability.line_number}():
    client = app.test_client()
    # Test malicious payload injection
    response = client.post('/login', data={'username': "' OR '1'='1"})
    assert response.status_code != 200
    assert b"token" not in response.data`;

      return (
        <div className="cyber-card">
          <h3 className="font-heading" style={{ fontSize: '0.95rem', color: '#fff', marginBottom: '12px' }}>
            <i className="fas fa-vial" style={{ color: 'var(--accent-green)', marginRight: '8px' }}></i>
            Synthesized Security Unit Test Suite
          </h3>
          <pre className="font-mono" style={{ background: '#040209', border: '1px solid var(--card-border)', borderRadius: '8px', padding: '14px', height: '180px', overflowY: 'auto', fontSize: '0.75rem', color: '#a7f3d0' }}>
            {sampleTest}
          </pre>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SentinelApp />);
  </script>
</body>
</html>
